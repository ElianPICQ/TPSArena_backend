[project]
name = "serverlist"
version = "0.1.0"
description = "TPSArena Server List API: game server registry, public server list, party allocation, join tickets"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "redis>=5.2",
    "tpsarena-common",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "testcontainers[postgres,redis]>=4.8",
]

[tool.uv.sources]
tpsarena-common = { git = "ssh://git@github.com/ElianPICQ/TPSArena_backend.git", tag = "common-v0.3.0", subdirectory = "libs/common" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["serverlist"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
