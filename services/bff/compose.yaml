# BFF alone:  docker compose up --build   (calls the other services on the host by default)
# In the full stack this file is included by the root docker-compose.yml (root .env sets the URLs).
services:
  bff:
    build: .
    restart: unless-stopped
    environment:
      AUTH_URL: ${AUTH_URL:-http://host.docker.internal:8001}
      SERVERLIST_URL: ${SERVERLIST_URL:-http://host.docker.internal:8002}
      SOCIAL_URL: ${SOCIAL_URL:-http://host.docker.internal:8003}
      STATS_URL: ${STATS_URL:-http://host.docker.internal:8004}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
