# Infrastructure shared by the services in the full stack (included by the root docker-compose.yml).
services:
  redis:
    image: redis:7
    command: ["sh", "/start.sh"]
    environment:
      REDIS_ADMIN_PASSWORD: ${REDIS_ADMIN_PASSWORD}
      AUTH_REDIS_PASSWORD: ${AUTH_REDIS_PASSWORD}
      SERVERLIST_REDIS_PASSWORD: ${SERVERLIST_REDIS_PASSWORD}
      SOCIAL_REDIS_PASSWORD: ${SOCIAL_REDIS_PASSWORD}
      STATS_REDIS_PASSWORD: ${STATS_REDIS_PASSWORD}
    volumes:
      - ./redis/start.sh:/start.sh:ro
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --user admin --pass \"$$REDIS_ADMIN_PASSWORD\" --no-auth-warning ping"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  redis-data:
