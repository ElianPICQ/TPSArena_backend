# The full stack: every service with its own database, plus the shared Redis.
# Each service can also run alone from its folder (see services/<name>/README.md).
# Variables come from the root .env (copy .env.example).
include:
  - path: infra/compose.yaml
    env_file: .env
  - path: [services/auth/compose.yaml, infra/fullstack/auth.yaml]
    env_file: .env
  - path: [services/serverlist/compose.yaml, infra/fullstack/serverlist.yaml]
    env_file: .env
  - path: [services/social/compose.yaml, infra/fullstack/social.yaml]
    env_file: .env
  - path: [services/stats/compose.yaml, infra/fullstack/stats.yaml]
    env_file: .env
  - path: [services/realtime/compose.yaml, infra/fullstack/realtime.yaml]
    env_file: .env
  - path: services/bff/compose.yaml
    env_file: .env
